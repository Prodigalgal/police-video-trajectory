name: 校验、构建与 GitOps 发布
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  application:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 公开信息与版本门禁
        run: |
          python3 ci/public-source-check.py
          python3 deploy/check-version-contract.py
          python3 ci/release-version-check.py
      - name: 安装构建工具与契约测试依赖
        run: |
          curl --fail --retry 3 --location --silent --show-error https://services.gradle.org/distributions/gradle-9.1.0-bin.zip --output /tmp/gradle.zip
          curl --fail --retry 3 --location --silent --show-error https://services.gradle.org/distributions/gradle-9.1.0-bin.zip.sha256 --output /tmp/gradle.sha256
          echo "$(cat /tmp/gradle.sha256)  /tmp/gradle.zip" | sha256sum --check
          unzip -q /tmp/gradle.zip -d /tmp
          python3 -m venv /tmp/contracts
          /tmp/contracts/bin/pip install --disable-pip-version-check -r ci/requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0
          npm ci --prefix web
      - name: 测试与构建
        run: |
          /tmp/gradle-9.1.0/bin/gradle -p services/core_api --no-daemon test bootJar
          node --test --test-reporter=dot web/tests/*.test.mjs
          /tmp/contracts/bin/python -m pytest -q tests/test_web_gateway.py tests/test_live_media.py tests/test_keyword_search.py tests/test_password_auth.py tests/test_ai_gateway.py tests/test_gateway_json_mode.py tests/test_simple_accounts.py tests/test_clue_api.py tests/test_recorded_media_api.py tests/test_processing_plugins.py tests/test_recording_review_api.py tests/test_capture_handoff.py tests/test_usability_api.py tests/test_usability_gitops.py tests/test_managed_models.py tests/test_midstream_gitops.py tests/test_inference_receipt.py tests/test_processing_trace_api.py
          /tmp/contracts/bin/python -m pytest -q tests/test_recording_windows.py tests/test_session_media.py
          npm run build --prefix web
          python3 deploy/check-version-contract.py --web-dist --jar "services/core_api/build/libs/police-video-core-api-$(cat VERSION).jar"
      - name: 确定不可变版本
        id: release
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d)-v$(cat VERSION)-ci-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: 发布权限预检
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.GITOPS_KNOWN_HOSTS }}
          GITOPS_REPOSITORY: ${{ secrets.GITOPS_REPOSITORY }}
        run: bash ci/check-gitops-access.sh
      - name: 登录镜像仓库
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: 构建并发布 Core
        id: core
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ci/Dockerfile.core
          push: true
          platforms: linux/arm64
          tags: ${{ vars.REGISTRY_NAMESPACE }}/police-video-core:${{ steps.release.outputs.tag }}
          build-args: APP_VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: 构建并发布 Python 与 Web
        id: runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ci/Dockerfile.runtime
          push: true
          platforms: linux/arm64
          tags: ${{ vars.REGISTRY_NAMESPACE }}/police-video-runtime:${{ steps.release.outputs.tag }}
          build-args: APP_VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: 回写私有 GitOps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.GITOPS_KNOWN_HOSTS }}
          GITOPS_REPOSITORY: ${{ secrets.GITOPS_REPOSITORY }}
          REGISTRY: ${{ vars.REGISTRY_NAMESPACE }}
          CORE_DIGEST: ${{ steps.core.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          key="$RUNNER_TEMP/police-video-deploy-key"
          hosts="$RUNNER_TEMP/police-video-known-hosts"
          gitops="$RUNNER_TEMP/police-video-gitops"
          trap 'rm -f "$key" "$hosts"; rm -rf "$gitops"' EXIT
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$hosts"
          chmod 600 "$key" "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts"
          echo "::add-mask::${GITOPS_REPOSITORY#git@}"
          echo "::add-mask::${GITOPS_REPOSITORY#git@github.com:}"
          git clone --depth 1 "$GITOPS_REPOSITORY" "$gitops"
          cd "$gitops"
          git config user.name 'police-video-release'
          git config user.email 'police-video-release@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            /tmp/contracts/bin/python "$GITHUB_WORKSPACE/ci/update-gitops.py" "$PWD" "$REGISTRY/police-video-core@$CORE_DIGEST" "$REGISTRY/police-video-runtime@$RUNTIME_DIGEST" "$VERSION" "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            git add police-video-trajectory
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "release(police-video): $VERSION ${GITHUB_SHA:0:12}"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
